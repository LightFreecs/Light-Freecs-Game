name: Build iOS

# Step 1 exports an Xcode project from Unity on Linux (cheap runner).
# Step 2 compiles it on a macOS runner and packages an UNSIGNED .ipa.
# Install it with a sideloading tool (e.g. Sideloadly / AltStore), which
# re-signs it with your own Apple ID. No paid Apple Developer account needed.
#
# Speed (2026-11-20, was ~17 min, now ~8 min warm): IL2CPP "faster (smaller) builds" for iOS (less generated C++);
# ccache on the macOS compile, including IL2CPP's own C++ build (a toolchain mirror whose clang goes through ccache;
# ~91 % hits on a warm build: xcodebuild 7m50s -> 43s); `xcodebuild build` instead of `archive`, no dSYM / index
# store; no disk cleanup on the Linux runner.

on:
  workflow_dispatch:

jobs:
  export-xcode:
    name: Export Xcode project
    runs-on: ubuntu-latest
    steps:
      # (No disk cleanup: the hosted runner now has ~88 GB free; the Unity image needs ~15 GB. Deleting the
      # Android / .NET / Haskell SDKs cost 2-3 minutes per build for nothing.)
      - name: Disk space
        run: df -h /

      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-iOS-

      - uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          buildName: LightMMORPG

      # Tar first: upload-artifact drops file permissions and symlinks, and the
      # Unity Xcode project relies on executable build-phase scripts.
      - name: Pack Xcode project
        run: sudo tar -czf ios-xcode-project.tar.gz -C build/iOS .

      - uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-project
          path: ios-xcode-project.tar.gz
          retention-days: 1

  compile:
    name: Compile on macOS (unsigned)
    needs: export-xcode
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ios-xcode-project

      - name: Unpack Xcode project
        run: |
          mkdir -p build/iOS
          tar -xzf ios-xcode-project.tar.gz -C build/iOS
          ls build/iOS

      # ccache: the C++ of the engine, FishNet and unchanged game code compiles to the same objects every build
      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-ios-${{ github.run_id }}
          restore-keys: ccache-ios-

      - name: Install ccache
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install ccache
          mkdir -p "$RUNNER_TEMP/cc"
          printf '#!/bin/sh\nexec ccache "%s" "$@"\n' "$(xcrun -f clang)" > "$RUNNER_TEMP/cc/clang"
          printf '#!/bin/sh\nexec ccache "%s" "$@"\n' "$(xcrun -f clang++)" > "$RUNNER_TEMP/cc/clang++"
          chmod +x "$RUNNER_TEMP/cc/clang" "$RUNNER_TEMP/cc/clang++"
          # IL2CPP's C++ (the bulk of the build) is compiled by Unity's own build tool in a script phase, from the
          # toolchain folder the script passes it. Give it a mirror of the Xcode toolchain whose clang / clang++ go
          # through ccache (everything else links to the real tools).
          REAL="$(dirname "$(dirname "$(dirname "$(xcrun -f clang)")")")"
          TC="$RUNNER_TEMP/tc"
          mkdir -p "$TC/usr/bin"
          for e in "$REAL"/*; do [ "$(basename "$e")" = usr ] || ln -s "$e" "$TC/"; done
          for e in "$REAL"/usr/*; do [ "$(basename "$e")" = bin ] || ln -s "$e" "$TC/usr/"; done
          for e in "$REAL"/usr/bin/*; do ln -s "$e" "$TC/usr/bin/"; done
          rm -f "$TC/usr/bin/clang" "$TC/usr/bin/clang++"
          cp "$RUNNER_TEMP/cc/clang" "$TC/usr/bin/clang"
          cp "$RUNNER_TEMP/cc/clang++" "$TC/usr/bin/clang++"
          echo "IL2CPP toolchain mirror: $TC (real: $REAL)"
          # point the IL2CPP script phase at it (only when IL2CPP_CCACHE_TOOLCHAIN is set)
          sed -i '' 's/--tool-chain-path=\\"$UNITY_TOOLCHAIN_DIR\\"/--tool-chain-path=\\"${IL2CPP_CCACHE_TOOLCHAIN:-$UNITY_TOOLCHAIN_DIR}\\"/' \
            build/iOS/LightMMORPG/Unity-iPhone.xcodeproj/project.pbxproj
          grep -c 'IL2CPP_CCACHE_TOOLCHAIN' build/iOS/LightMMORPG/Unity-iPhone.xcodeproj/project.pbxproj
          ccache --zero-stats
          ccache --show-stats | head -5

      - name: xcodebuild (no code signing)
        env:
          CCACHE_DIR: ~/.ccache
          CCACHE_MAXSIZE: 3G
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_SLOPPINESS: clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
          CCACHE_FILECLONE: "true"
          CCACHE_DEPEND: "true"
          CCACHE_INODECACHE: "true"
        run: |
          export CCACHE_DIR="$HOME/.ccache"
          export IL2CPP_CCACHE_TOOLCHAIN="$RUNNER_TEMP/tc"
          cd build/iOS/LightMMORPG
          xcodebuild -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/dd" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            DEBUG_INFORMATION_FORMAT=dwarf COMPILER_INDEX_STORE_ENABLE=NO \
            CC="$RUNNER_TEMP/cc/clang" CXX="$RUNNER_TEMP/cc/clang++" \
            LD="$(xcrun -f clang)" LDPLUSPLUS="$(xcrun -f clang++)" \
            build
          ccache --show-stats

      - name: Package unsigned .ipa
        run: |
          cd build/iOS/LightMMORPG
          APP=$(find dd/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then echo "No .app found in the build products"; ls -R dd/Build/Products | head -50; exit 1; fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          # Unity ships UnityRuntime.framework pre-signed; its leftover _CodeSignature files make
          # sideload re-signing produce an invalid signature (ApplicationVerificationFailed 0xe8008019).
          # Strip every existing signature so Sideloadly/AltStore sign the whole bundle cleanly.
          find Payload -type d -name _CodeSignature -prune -exec rm -rf {} +
          find Payload -name embedded.mobileprovision -delete
          for f in Payload/*.app/Frameworks/*.framework Payload/*.app/Frameworks/*.dylib; do
            [ -e "$f" ] && codesign --remove-signature "$f" || true
          done
          zip -qry LightMMORPG-unsigned.ipa Payload
          ls -lh LightMMORPG-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: LightMMORPG-iOS-ipa
          path: build/iOS/LightMMORPG/LightMMORPG-unsigned.ipa
